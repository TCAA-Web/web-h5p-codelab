<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>HTML Coding Lab</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f5f7fa;
      }

      header {
        background: #0066cc;
        color: white;
        padding: 15px;
      }

      .container {
        max-width: 1200px;
        margin: auto;
        padding: 20px;
      }

      .progress {
        width: 100%;
        height: 20px;
        background: #ddd;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: #28a745;
        border-radius: 10px;
        transition: 0.3s;
      }

      .challenge {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      textarea {
        width: 100%;
        height: 300px;
        font-family: monospace;
        font-size: 16px;
      }

      button {
        padding: 10px 18px;
        margin: 8px 5px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .run {
        background: #28a745;
        color: white;
      }

      .next {
        background: #0066cc;
        color: white;
      }

      .preview {
        background: white;
        border: 1px solid #ccc;
        height: 250px;
        margin-top: 15px;
      }

      .feedback {
        margin-top: 15px;
        font-weight: bold;
      }

      .success {
        color: green;
      }

      .error {
        color: red;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      #score {
        font-size: 18px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>HTML Coding Lab</h1>
      <div id="score">Score: 0 / 9</div>
    </header>

    <div class="container">
      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="challenge">
        <h2 id="title"></h2>
        <p id="description"></p>

        <textarea id="editor"></textarea>

        <br />

        <button class="run" onclick="runCode()">Kør kode</button>

        <button class="next" id="nextBtn" onclick="nextChallenge()" disabled>
          Næste udfordring
        </button>

        <div class="feedback" id="feedback"></div>

        <div class="preview">
          <iframe id="preview"></iframe>
        </div>
      </div>
    </div>

    <script>
      const challenges = [
        {
          title: "1. Almindelige HTML-tags",
          description: "Udfyld manglende tags og attributter",
          starter: `<___>Min hjemmeside</___>

<___>Velkommen til mit site</___>

<a ___="https://example.com">
Besøg side
</a>

<img ___="cat.jpg" ___="Kat">`,
          required: ["h1", "p", "href", "src", "alt"],
        },

        {
          title: "2. Find fejlene",
          description: "Ret fejlene i koden",
          starter: `<h1>Dyr<h1>

<p>Katte er søde

<img scr="cat.jpg">`,
          required: ["</h1>", "</p>", "src="],
        },

        {
          title: "3. Lister",
          description: "Lav en ul liste med tre elementer",
          starter: ``,
          required: ["<ul>", "<li>", "HTML", "CSS", "JavaScript"],
        },

        {
          title: "4. Semantic HTML",
          description: "Brug semantic tags",
          starter: ``,
          required: ["header", "nav", "main", "footer"],
        },

        {
          title: "5. Semantic fejlfinding",
          description: "Erstat div med semantic tags",
          starter: `<div class="header"></div>
<div class="navigation"></div>
<div class="footer"></div>`,
          required: ["header", "nav", "footer"],
        },

        {
          title: "6. Formularer",
          description: "Opret navn, email og submit",
          starter: `<form>

</form>`,
          required: ["form", "input", "email", "submit"],
        },

        {
          title: "7. Labels",
          description: "Kobl label og input sammen",
          starter: `<label>Name</label>
<input id="name" type="text">`,
          required: ["for="],
        },

        {
          title: "8. Attributter",
          description: "Brug placeholder, required, href",
          starter: ``,
          required: ["placeholder", "required", "href"],
        },

        {
          title: "9. Afsluttende projekt",
          description: "Byg komplet HTML-side",
          starter: ``,
          required: [
            "header",
            "nav",
            "main",
            "footer",
            "h1",
            "p",
            "img",
            "a",
            "form",
            "button",
          ],
        },
      ];

      let current = 0;
      let score = 0;

      function loadChallenge() {
        title.innerText = challenges[current].title;

        description.innerText = challenges[current].description;

        editor.value = challenges[current].starter;

        feedback.innerHTML = "";

        nextBtn.disabled = true;

        updateProgress();
      }

      function runCode() {
        const code = editor.value;

        preview.srcdoc = code;

        const req = challenges[current].required;

        let missing = [];

        req.forEach((item) => {
          if (!code.includes(item)) {
            missing.push(item);
          }
        });

        if (missing.length === 0) {
          feedback.innerHTML =
            "<span class='success'>✅ Korrekt! Du kan gå videre.</span>";

          nextBtn.disabled = false;
        } else {
          feedback.innerHTML =
            "<span class='error'>❌ Mangler: " + missing.join(", ") + "</span>";

          nextBtn.disabled = true;
        }
      }

      function nextChallenge() {
        score++;

        document.getElementById("score").innerText = "Score: " + score + " / 9";

        current++;

        if (current >= challenges.length) {
          document.querySelector(".challenge").innerHTML = `
<h1>🎉 Tillykke!</h1>

<h2>Du har gennemført HTML Coding Lab</h2>

<p>Score: ${score}/9</p>

<h3>🏆 Badge opnået:</h3>

<p>HTML Expert</p>
`;

          updateProgress(true);

          return;
        }

        loadChallenge();
      }

      function updateProgress(finished = false) {
        let percent = finished ? 100 : (current / challenges.length) * 100;

        progressBar.style.width = percent + "%";
      }

      loadChallenge();
    </script>
  </body>
</html>
