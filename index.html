<!doctype html>
<html lang="da" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>HTML Coding Lab</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-logo" aria-hidden="true">&lt;/&gt;</span>
          <div class="brand-text">
            <strong>HTML Coding Lab</strong>
            <span>Begynder-forløb · 9 udfordringer</span>
          </div>
        </div>

        <div class="progress" id="progress" role="progressbar" aria-label="Fremskridt" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0">
          <div class="progress-meta">
            <span id="progressLabel">0 / 9 løst</span>
            <span id="progressPct">0 %</span>
          </div>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>

        <div class="top-actions">
          <button class="btn btn-ghost" id="badgesBtn" type="button" title="Se dine badges">
            <span aria-hidden="true">🏅</span> <span class="hide-sm">Badges</span> <span class="count-pill" id="badgeCount">0</span>
          </button>
          <button class="btn btn-icon" id="themeBtn" type="button" aria-label="Skift mellem dark og light mode" title="Skift tema">
            <span id="themeIcon" aria-hidden="true">🌙</span>
          </button>
          <button class="btn btn-icon" id="restartBtn" type="button" aria-label="Start hele forløbet forfra" title="Start forfra">
            <span aria-hidden="true">↺</span>
          </button>
        </div>
      </header>

      <nav class="stepper" id="stepper" aria-label="Udfordringer"></nav>

      <main class="workspace">
        <section class="card side" aria-labelledby="chTitle">
          <div class="side-head">
            <div class="side-icon" id="chIcon" aria-hidden="true"></div>
            <div>
              <div class="eyebrow" id="chTopic"></div>
              <h1 id="chTitle"></h1>
            </div>
          </div>

          <div class="tabs" role="tablist">
            <button class="tab is-active" role="tab" id="tab-task" aria-controls="panel-task" aria-selected="true" data-tab="task" type="button">Opgave</button>
            <button class="tab" role="tab" id="tab-feedback" aria-controls="panel-feedback" aria-selected="false" data-tab="feedback" type="button">
              Feedback <span class="tab-badge" id="feedbackBadge" hidden></span>
            </button>
            <button class="tab" role="tab" id="tab-syntax" aria-controls="panel-syntax" aria-selected="false" data-tab="syntax" type="button">
              Syntaks <span class="tab-badge" id="syntaxBadge" hidden></span>
            </button>
          </div>

          <div class="panels">
            <div class="panel is-active" id="panel-task" role="tabpanel" aria-labelledby="tab-task">
              <div class="rich" id="chDesc"></div>
              <div class="hints">
                <div class="hints-head">
                  <h2>Hints</h2>
                  <button class="btn btn-small" id="hintBtn" type="button">💡 Vis hint</button>
                </div>
                <ol class="hint-list" id="hintList"></ol>
              </div>
            </div>

            <div class="panel" id="panel-feedback" role="tabpanel" aria-labelledby="tab-feedback" aria-live="polite">
              <div id="feedback"></div>
            </div>

            <div class="panel" id="panel-syntax" role="tabpanel" aria-labelledby="tab-syntax">
              <div id="syntaxList"></div>
            </div>
          </div>
        </section>

        <section class="right">
          <div class="card editor-card">
            <div class="card-bar">
              <div class="file-tab"><span class="file-dot"></span> index.html</div>
              <div class="bar-actions">
                <button class="btn btn-ghost btn-small" id="resetBtn" type="button">Nulstil</button>
                <button class="btn btn-primary" id="runBtn" type="button" title="Ctrl/⌘ + Enter">▶ Tjek kode</button>
                <button class="btn btn-next" id="nextBtn" type="button" disabled>Næste →</button>
              </div>
            </div>
            <div id="editor" class="editor" aria-label="Kodeeditor"></div>
          </div>

          <div class="card preview-card">
            <div class="card-bar">
              <div class="browser-dots" aria-hidden="true"><i></i><i></i><i></i></div>
              <div class="url-pill">Live preview</div>
              <span class="live-dot" title="Opdateres mens du skriver">● live</span>
            </div>
            <iframe
              id="preview"
              title="Live preview af din kode"
              sandbox="allow-popups allow-popups-to-escape-sandbox"
              referrerpolicy="no-referrer"
            ></iframe>
          </div>
        </section>
      </main>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="modal-backdrop" id="modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close btn btn-icon" id="modalClose" type="button" aria-label="Luk">✕</button>
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>
        <div class="modal-actions" id="modalActions"></div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script src="js/syntax.js"></script>
    <script src="js/validators.js"></script>
    <script src="js/challenges.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
