<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HTML Lab V2</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>HTML Coding Lab</h1>
      <div id="status"></div>
    </header>
    <div class="wrap">
      <div class="left">
        <h2 id="title"></h2>
        <p id="desc"></p>
        <div id="editor"></div>
        <div class="toolbar">
          <button onclick="runCode()">Kør kode</button
          ><button onclick="resetCode()">Nulstil</button
          ><button id="nextBtn" disabled onclick="nextChallenge()">
            Næste
          </button>
        </div>
        <div id="feedback"></div>
      </div>
      <div class="right"><iframe id="preview"></iframe></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script src="js/challenges.js"></script>
    <script src="js/validators.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
